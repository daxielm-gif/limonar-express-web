<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Limonar Express</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box {
            max-width: 400px;
            margin: 60px auto;
            background: var(--blanco);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--sombra);
        }
        .login-box h1 {
            font-family: var(--fuente-display);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 8px;
            color: var(--verde);
        }
        .login-box p {
            text-align: center;
            color: var(--texto-suave);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .error-msg {
            background: #fdecea;
            color: #c0392b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">Limonar<span>Express</span></a>
        </div>
    </header>

    <div class="login-box">
        <h1>Panel de Vendedores</h1>
        <p>Ingresa tus datos para gestionar tus productos</p>

        <div id="error" class="error-msg"></div>

        <form id="login-form">
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="usuario" required placeholder="Tu usuario" autocomplete="username">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="Tu contraseña" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'none';

            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorDiv.textContent = data.error || 'Error al iniciar sesión';
                    errorDiv.style.display = 'block';
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('vendedor', JSON.stringify(data.vendedor));
                window.location.href = 'vendedor.html';
            } catch (err) {
                errorDiv.textContent = 'Error de conexión. Intenta de nuevo.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
