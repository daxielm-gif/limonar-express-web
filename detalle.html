<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Producto - Limonar Express</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .detalle-container { max-width: 800px; margin: 20px auto; padding: 20px; background: var(--blanco); border-radius: 15px; }
        .img-grande { width: 100%; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-height: 400px; object-fit: contain; background: #eee; }
        .info-tecnica { background: var(--fondo); padding: 15px; border-radius: 10px; margin: 15px 0; border-left: 5px solid var(--verde); }
        .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .acciones button { flex: 1; min-width: 140px; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        body.dark-mode .detalle-container { background: #1e1e1e; }
        body.dark-mode .info-tecnica { background: #2d2d2d; color: #eee; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">Limonar<span>Express</span></a>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">⬅️ Volver a la Tienda</a>
            </nav>
        </div>
    </header>

    <main class="detalle-container">
        <div id="contenido-detalle">
            <p style="text-align:center;">Cargando detalles del producto...</p>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        window.onload = () => {
            if (localStorage.getItem('tema') === 'oscuro') document.body.classList.add('dark-mode');

            const p = JSON.parse(localStorage.getItem('producto_seleccionado'));
            if (!p) {
                document.getElementById('contenido-detalle').innerHTML = "<h2>Producto no encontrado</h2>";
                return;
            }

            const container = document.getElementById('contenido-detalle');
            container.innerHTML = `
                <img src="${p.image || ''}" class="img-grande" onerror="this.src='https://via.placeholder.com/600x400/e8f5ee/1a7a4a?text=Limonar+Express'">
                <h1>${p.name}</h1>
                <h2 style="color: var(--verde); margin: 8px 0;">
                    ${p.priceUSD > 0 ? `$${p.priceUSD} USD` : ''}
                    ${p.priceMN > 0 ? ` · ${p.priceMN.toLocaleString()} MN` : ''}
                </h2>
                
                <div class="info-tecnica">
                    <p><strong>📍 Zona:</strong> ${p.location || '—'}</p>
                    <p><strong>🚚 Entrega:</strong> ${p.tipoEntrega || '—'}</p>
                    <p><strong>📦 Stock:</strong> ${p.stock > 0 ? p.stock + ' disponibles' : 'Agotado'}</p>
                    ${p.vendedor_nombre ? `<p><strong>👤 Vendedor:</strong> ${p.vendedor_nombre}</p>` : ''}
                    ${p.garantia ? `<p><strong>🛡️ Garantía:</strong> ${p.garantia}</p>` : ''}
                    ${p.pagos ? `<p><strong>💳 Pagos:</strong> ${p.pagos}</p>` : ''}
                    ${p.mapa ? `<p><strong>🗺️ Ubicación:</strong> <a href="${p.mapa}" target="_blank" style="color:#007bff;">Ver en Google Maps</a></p>` : ''}
                    ${p.descripcion ? `<p><strong>📝 Descripción:</strong> ${p.descripcion}</p>` : ''}
                </div>

                <div class="acciones">
                    <button onclick="agregarAlCarritoDetalle()" style="background:var(--verde); color:white;">🛒 Añadir al carrito</button>
                    <button onclick="preguntarWhatsApp('${p.name.replace(/'/g, "\\'")}')" style="background:#25D366; color:white;">💬 Consultar por WhatsApp</button>
                </div>
            `;
        };

        function agregarAlCarritoDetalle() {
            const p = JSON.parse(localStorage.getItem('producto_seleccionado'));
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            const itemExistente = carrito.find(item => item.id === p.id);
            if (itemExistente) itemExistente.cantidad += 1;
            else carrito.push({ ...p, cantidad: 1 });
            localStorage.setItem('carrito', JSON.stringify(carrito));
            alert("¡Añadido al carrito!");
        }

        function preguntarWhatsApp(nombre) {
            const msj = `Hola! Me interesa el producto: *${nombre}*. ¿Está disponible y hacen envíos hoy?`;
            window.open(`https://wa.me/5358956989?text=${encodeURIComponent(msj)}`, '_blank');
        }
    </script>
</body>
</html>
